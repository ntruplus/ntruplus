name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 / GCC
            runner: ubuntu-24.04
            compiler: gcc
            backend: avx2
          - name: Linux x86_64 / Clang
            runner: ubuntu-24.04
            compiler: clang
            backend: avx2
          - name: Linux arm64 / GCC
            runner: ubuntu-24.04-arm
            compiler: gcc
            backend: aarch64
          - name: Linux arm64 / Clang
            runner: ubuntu-24.04-arm
            compiler: clang
            backend: aarch64
          - name: macOS Intel / Apple Clang
            runner: macos-15-intel
            compiler: clang
            backend: avx2
          - name: macOS arm64 / Apple Clang
            runner: macos-15
            compiler: clang
            backend: aarch64
          - name: Windows x86_64 / GCC (MinGW-w64 UCRT)
            runner: windows-2025
            compiler: gcc
            backend: avx2
            msystem: UCRT64
            packages: mingw-w64-ucrt-x86_64-gcc
          - name: Windows x86_64 / Clang (MinGW-w64 UCRT)
            runner: windows-2025
            compiler: clang
            backend: avx2
            msystem: UCRT64
            packages: mingw-w64-ucrt-x86_64-clang
          - name: Windows arm64 / Clang (MinGW-w64)
            runner: windows-11-arm
            compiler: clang
            backend: portable
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MinGW-w64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            diffutils
            ${{ matrix.packages }}

      - name: Check implementations and KATs
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/test-platform.sh "${{ matrix.compiler }}" "${{ matrix.backend }}"

      - name: Check implementations and KATs on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash .github/scripts/test-platform.sh "${{ matrix.compiler }}" "${{ matrix.backend }}"
