name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Reference / Linux x86_64 / Clang
            implementation: Reference_Implementation
            compiler: clang
            runner: ubuntu-24.04
            shake256_asm: 0
          - name: Reference / Linux x86_64 / GCC
            implementation: Reference_Implementation
            compiler: gcc
            runner: ubuntu-24.04
            shake256_asm: 0
          - name: Reference / Linux arm64 / Clang
            implementation: Reference_Implementation
            compiler: clang
            runner: ubuntu-24.04-arm
            shake256_asm: 0
          - name: Reference / Linux arm64 / GCC
            implementation: Reference_Implementation
            compiler: gcc
            runner: ubuntu-24.04-arm
            shake256_asm: 0
          - name: Reference / Windows x86_64 / GCC (MinGW-w64 UCRT)
            implementation: Reference_Implementation
            compiler: gcc
            runner: windows-2025
            shake256_asm: 0
            packages: mingw-w64-ucrt-x86_64-gcc
          - name: Reference / Windows x86_64 / Clang (MinGW-w64 UCRT)
            implementation: Reference_Implementation
            compiler: clang
            runner: windows-2025
            shake256_asm: 0
            packages: mingw-w64-ucrt-x86_64-clang
          - name: OptC / Linux x86_64 / Clang
            implementation: Optimized_Implementation
            compiler: clang
            runner: ubuntu-24.04
            shake256_asm: 0
          - name: OptC / Linux x86_64 / GCC
            implementation: Optimized_Implementation
            compiler: gcc
            runner: ubuntu-24.04
            shake256_asm: 0
          - name: OptC / Linux arm64 / Clang
            implementation: Optimized_Implementation
            compiler: clang
            runner: ubuntu-24.04-arm
            shake256_asm: 0
          - name: OptC / Linux arm64 / GCC
            implementation: Optimized_Implementation
            compiler: gcc
            runner: ubuntu-24.04-arm
            shake256_asm: 0
          - name: OptC / Windows x86_64 / GCC (MinGW-w64 UCRT)
            implementation: Optimized_Implementation
            compiler: gcc
            runner: windows-2025
            shake256_asm: 0
            packages: mingw-w64-ucrt-x86_64-gcc
          - name: OptC / Windows x86_64 / Clang (MinGW-w64 UCRT)
            implementation: Optimized_Implementation
            compiler: clang
            runner: windows-2025
            shake256_asm: 0
            packages: mingw-w64-ucrt-x86_64-clang
          - name: AVX2 / Linux x86_64 / Clang
            implementation: Additional_Implementation/avx2
            compiler: clang
            runner: ubuntu-24.04
            shake256_asm: 0
          - name: AVX2 / Linux x86_64 / GCC
            implementation: Additional_Implementation/avx2
            compiler: gcc
            runner: ubuntu-24.04
            shake256_asm: 0
          - name: AVX2 / macOS Intel / Apple Clang
            implementation: Additional_Implementation/avx2
            compiler: clang
            runner: macos-15-intel
            shake256_asm: 0
          - name: AVX2 / Windows x86_64 / GCC (MinGW-w64 UCRT)
            implementation: Additional_Implementation/avx2
            compiler: gcc
            runner: windows-2025
            shake256_asm: 0
            packages: mingw-w64-ucrt-x86_64-gcc
          - name: AVX2 / Windows x86_64 / Clang (MinGW-w64 UCRT)
            implementation: Additional_Implementation/avx2
            compiler: clang
            runner: windows-2025
            shake256_asm: 0
            packages: mingw-w64-ucrt-x86_64-clang
          - name: AArch64 / Linux arm64 / Clang / SHA3
            implementation: Additional_Implementation/aarch64
            compiler: clang
            runner: ubuntu-24.04-arm
            shake256_asm: 1
          - name: AArch64 / Linux arm64 / Clang / portable SHAKE256
            implementation: Additional_Implementation/aarch64
            compiler: clang
            runner: ubuntu-24.04-arm
            shake256_asm: 0
          - name: AArch64 / Linux arm64 / GCC / SHA3
            implementation: Additional_Implementation/aarch64
            compiler: gcc
            runner: ubuntu-24.04-arm
            shake256_asm: 1
          - name: AArch64 / Linux arm64 / GCC / portable SHAKE256
            implementation: Additional_Implementation/aarch64
            compiler: gcc
            runner: ubuntu-24.04-arm
            shake256_asm: 0
          - name: AArch64 / macOS arm64 / Apple Clang / portable SHAKE256
            implementation: Additional_Implementation/aarch64
            compiler: clang
            runner: macos-15
            shake256_asm: 0
          - name: AArch64 / macOS arm64 / Apple Clang / SHA3
            implementation: Additional_Implementation/aarch64
            compiler: clang
            runner: macos-15
            shake256_asm: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MinGW-w64 UCRT
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            ${{ matrix.packages }}

      - name: Verify runner instruction set
        if: runner.os != 'Windows' && contains(matrix.implementation, 'Additional_Implementation')
        shell: bash
        run: bash .github/scripts/check-cpu.sh "${{ matrix.implementation }}" "${{ matrix.shake256_asm }}" "${{ matrix.compiler }}"

      - name: Verify Windows instruction set
        if: runner.os == 'Windows' && contains(matrix.implementation, 'Additional_Implementation')
        shell: msys2 {0}
        run: bash .github/scripts/check-cpu.sh "${{ matrix.implementation }}" "${{ matrix.shake256_asm }}" "${{ matrix.compiler }}"

      - name: Build, test, and compare KATs
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/test.sh "${{ matrix.implementation }}" "${{ matrix.compiler }}" "${{ matrix.shake256_asm }}"

      - name: Build, test, and compare KATs on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash .github/scripts/test.sh "${{ matrix.implementation }}" "${{ matrix.compiler }}" "${{ matrix.shake256_asm }}"
